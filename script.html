function clearEyeVisitTimers() {

if (eyeBall && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const ballSize = 24;
  let ballX = Math.max(12, window.innerWidth * .18);
  let ballY = Math.max(12, window.innerHeight * .2);
  let ballVX = 2.25;
  let ballVY = 1.75;
  let ballRotation = 0;
  let lastFrame = performance.now();

  function animateEyeBall(now) {
    // Normalize speed across displays while limiting jumps after backgrounding.
    const step = Math.min(2, (now - lastFrame) / 16.67);
    lastFrame = now;
    ballX += ballVX * step;
    ballY += ballVY * step;
    ballRotation += ballVX * step * 2.4;

    const maxX = Math.max(0, window.innerWidth - ballSize);
    const maxY = Math.max(0, window.innerHeight - ballSize);
    if (ballX <= 0 || ballX >= maxX) {
      ballX = Math.max(0, Math.min(maxX, ballX));
      ballVX *= -1;
    }
    if (ballY <= 0 || ballY >= maxY) {
      ballY = Math.max(0, Math.min(maxY, ballY));
      ballVY *= -1;
    }
    eyeBall.style.transform = `translate3d(${ballX}px, ${ballY}px, 0) rotate(${ballRotation}deg)`;
    requestAnimationFrame(animateEyeBall);
  }

  eyeBall.addEventListener('click', event => {
    event.preventDefault();
    const rect = eyeBall.getBoundingClientRect();
    let awayX = rect.left + rect.width / 2 - event.clientX;
    let awayY = rect.top + rect.height / 2 - event.clientY;
    if (Math.abs(awayX) + Math.abs(awayY) < 1) {
      awayX = Math.random() - .5;
      awayY = Math.random() - .5;
    }
    const distance = Math.hypot(awayX, awayY) || 1;
    ballVX = awayX / distance * 6.5;
    ballVY = awayY / distance * 6.5;
    eyeBall.classList.remove('hit');
    void eyeBall.offsetWidth;
    eyeBall.classList.add('hit');
  });

  // The cursor creates a repelling field around the ball, so users can guide
  // it without needing to click precisely on a moving target.
  document.addEventListener('pointermove', event => {
    if (eyeGameLayer.classList.contains('main-mode') &&
        !eyeGameLayer.classList.contains('main-visible')) return;
    const centerX = ballX + ballSize / 2;
    const centerY = ballY + ballSize / 2;
    const awayX = centerX - event.clientX;
    const awayY = centerY - event.clientY;
    const distance = Math.hypot(awayX, awayY);
    const repelRadius = 110;
    if (distance > 0 && distance < repelRadius) {
      const force = (repelRadius - distance) / repelRadius;
      ballVX += awayX / distance * force * 1.5;
      ballVY += awayY / distance * force * 1.5;
      const speed = Math.hypot(ballVX, ballVY);
      if (speed > 7) {
        ballVX = ballVX / speed * 7;
        ballVY = ballVY / speed * 7;
      }
    }
  });

  window.addEventListener('resize', () => {
    ballX = Math.min(ballX, Math.max(0, window.innerWidth - ballSize));
    ballY = Math.min(ballY, Math.max(0, window.innerHeight - ballSize));
  });
  requestAnimationFrame(animateEyeBall);
}

function switchTab(tab) {
  const loginForm = document.getElementById('login-form');
  const regForm   = document.getElementById('register-form');

  const tabReg    = document.getElementById('tab-register');

  } else {

  }
}

function showAuthError(msg) { authError.textContent = msg; authError.classList.add('visible'); }
function clearAuthError()   { authError.textContent = ''; authError.classList.remove('visible'); }

async function handleLogin(e) {
  e.preventDefault(); clearAuthError();
  const username = document.getElementById('login-user')
    .value
    .trim()
    .replace(/\s+/g, ' ');
  const password = document.getElementById('login-pass').value;
  const btn      = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await postToScript({ action: 'login', username, password });
    if (res.error) { showAuthError(res.error); return; }
    chatToken = res.chatToken || '';
    onLoginSuccess(res.username);
  } catch (err) {
    console.error('LOGIN ERROR:', err);
    showAuthError('Login error: ' + err.message);}
  finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function handleRegister(e) {
  e.preventDefault(); clearAuthError();
  const username = document.getElementById('reg-user')
    .value
    .trim()
    .replace(/\s+/g, ' ');
  const password = document.getElementById('reg-pass').value;
  const confirm  = document.getElementById('reg-pass2').value;
  const btn      = document.getElementById('reg-btn');
  if (password !== confirm) { showAuthError('Passwords do not match.'); return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const res = await postToScript({ action: 'register', username, password });
    if (res.error) { showAuthError(res.error); return; }
    chatToken = res.chatToken || '';
    onLoginSuccess(res.username);
  } catch { showAuthError('Could not reach the Apps Script. Check your URL in script.js.'); }
  finally { btn.disabled = false; btn.textContent = 'Create Account'; }
}

async function postToScript(payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) reject(new Error(result.error));
        else resolve(result || { success: true });
      })
      .withFailureHandler(error => reject(new Error(error.message || error)))
      .serverRequest(payload);
  });
}


/* ── Save queue ─────────────────────────────────────────────────── */
const saveQueue = [];
let queueRunning = false;
let savesPaused = false;

function isFatalApiError(err) {
  return /HTTP 404|Invalid response from Apps Script|Empty response from Apps Script/.test(
    String(err && err.message)
  );
}

function failQueuedSaves(err) {
  while (saveQueue.length) {
    const queuedJob = saveQueue.shift();
    if (queuedJob.onFail) queuedJob.onFail(err);
  }
}

function queueSave(payload, onSuccess, onFail) {
  if (!payload.username) {
    if (onFail) onFail(new Error('Not logged in. Please sign in again.'));
    return;
  }
  if (savesPaused) {
    if (onFail) onFail(new Error('Saves are paused because the Apps Script endpoint is unavailable.'));
    return;
  }
  saveQueue.push({ payload, onSuccess, onFail });
  processSaveQueue();
}

async function processSaveQueue() {
  if (queueRunning || !saveQueue.length) return;

  queueRunning = true;

  const job = saveQueue.shift();

  try {
    const result = await postToScript(job.payload);

    // Apps Script reports application failures as JSON, not HTTP errors.
    // Treat those exactly like transport failures so optimistic UI changes
    // are rolled back instead of being reported as saved.
    if (result && result.error) {
      throw new Error(result.error);
    }

    if (job.onSuccess) {
      job.onSuccess(result);
    }

  } catch (err) {
    console.error('Save failed:', err);

    if (job.onFail) {
      job.onFail(err);
    }

    if (isFatalApiError(err)) {
      savesPaused = true;
      failQueuedSaves(err);
      showToast('Saves paused — Apps Script deployment is unavailable.', 'error');
    }

  } finally {
    queueRunning = false;
    processSaveQueue();
  }
}

async function fetchNotifications() {
  try {
    const data = await new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error.message || error)))
        .serverNotifications();
    });
    renderNotifications(Array.isArray(data && data.notifications) ? data.notifications : []);
  } catch (err) {
    console.warn('Notifications unavailable:', err);
    renderNotifications([]);
  }
}

async function deleteQL(date, leadNumber) {

  if (!confirm('Reject this Qualified Lead?')) return;

  try {

    const result = await postToScript({
      action: 'deleteQL',
      date,
      leadNumber: Number(leadNumber),
      username: currentUser
    });

    if (result.error) {
      throw new Error(result.error);
    }

    showToast('Qualified Lead rejected', 'success');

    // Reload everything:
    // - QL count
    // - QL notes
    // - Today's Notes
    // - Daily Performance
    // - Chart
    await fetchMonthlyData();

  } catch (err) {

    console.error('deleteQL failed:', err);

    showToast('Failed to reject Qualified Lead', 'error');

  }
}



function buildMonthPicker() {
  monthSelect.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(now.getMonth() - i);
    const value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const opt   = document.createElement('option');
    opt.value = value; opt.textContent = label;
    monthSelect.appendChild(opt);
  }
  selectedMonth = monthSelect.value;
}

          </div>

        </div>
      `;

    } else {
      // ── Regular stat card ───────────────────────────────────────
      card.className  = 'stat-card';
      card.dataset.key = cat.key;

      const qualityHTML = cat.quality ? `
        <div class="quality-box">
          <label class="quality-item">
            <input type="checkbox" class="quality-fp" />
            <span>Full Pitch</span>
          </label>
          <label class="quality-item">
            <input type="checkbox" class="quality-mp" />
            <span>Money Part</span>
          </label>
        </div>` : '';

      card.innerHTML = `
        <div class="stat-card-top">
          <span class="stat-label">${cat.label}</span>
          <span class="stat-count" style="color:${cat.color}" data-count="${cat.key}">0</span>
        </div>
        ${qualityHTML}
        <div class="stat-actions">
          <button class="btn btn-increment" data-action="inc" data-key="${cat.key}">${cat.label}</button>
          <button class="btn btn-undo" data-action="dec" data-key="${cat.key}" aria-label="Undo">↶</button>
        </div>
      `;
    }

    // Button click listeners
    card.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); onStatClick(e); });
    });

    statsGrid.appendChild(card);
  });

  // FP/MP checkbox dependency
  statsGrid.querySelectorAll('.quality-fp').forEach(fp => {
    fp.addEventListener('change', function () {
      const mp = this.closest('.stat-card').querySelector('.quality-mp');
      if (!this.checked) mp.checked = false;
    });
  });
  statsGrid.querySelectorAll('.quality-mp').forEach(mp => {
    mp.addEventListener('change', function () {
      const fp = this.closest('.stat-card').querySelector('.quality-fp');
      if (this.checked) fp.checked = true;
    });
  });
}

/* ── Click handler ───────────────────────────────────────────────── */
async function undoLastQL(){
  const today = todayISO();
  if ((todayCounts.ql || 0) <= 0) {
    showToast(
      'No Qualified Lead to undo',
      'error'
    );
    return;
  }

  todayCounts.ql--;
  todayCounts.fp = Math.max(0, (todayCounts.fp || 0) - 1);
  todayCounts.mp = Math.max(0, (todayCounts.mp || 0) - 1);

  const notes = qlNotesByDate[today] || [];
  const removedNote = notes.length ? notes.pop() : null;
  renderQLNotesToday();

  updateStatCounts();
  updateChart();
  updateTotalCalls();
  renderDailyPerformance();

  // Queue this behind any pending input. The backend applies the count and
  // note removal atomically, so undo cannot race a just-entered QL.
  queueSave({
      action: 'undoLastQL',
      date: today,
      username: currentUser
    },
    () => showToast('Qualified Lead removed', 'success'),
    () => {
      todayCounts.ql++;
      todayCounts.fp++;
      todayCounts.mp++;
      if (removedNote) {
        if (!qlNotesByDate[today]) qlNotesByDate[today] = [];
        qlNotesByDate[today].push(removedNote);
      }
      renderQLNotesToday();
      updateStatCounts();
      updateChart();
      updateTotalCalls();
      renderDailyPerformance();
      showToast('Undo failed — check connection', 'error');
    }
  );

}

function undoLastStat(category) {
  if (!currentUser) {
    showToast('Not logged in', 'error');
    return;
  }

  if ((todayCounts[category] || 0) <= 0) {
    showToast('No input to undo', 'error');
    return;
  }

  const card = document.querySelector(
    `.stat-card[data-key="${category}"]`
  );

  const fpCheckbox = card ? card.querySelector('.quality-fp') : null;
  const mpCheckbox = card ? card.querySelector('.quality-mp') : null;

  // Remember checkbox state in case the undo fails
  const wasFpChecked = Boolean(fpCheckbox && fpCheckbox.checked);
  const wasMpChecked = Boolean(mpCheckbox && mpCheckbox.checked);

  // Clear the checkboxes immediately
  if (fpCheckbox) fpCheckbox.checked = false;
  if (mpCheckbox) mpCheckbox.checked = false;

  // Immediately decrease the category on screen
  todayCounts[category] = Math.max(
    0,
    (todayCounts[category] || 0) - 1
  );

  updateStatCounts();
  updateChart();
  updateTotalCalls();
  renderDailyPerformance();

  queueSave(
    {
      action: 'undoLastStat',
      date: todayISO(),
      username: currentUser,
      category: category
    },

    result => {
      // Apps Script tells us whether the original input had FP/MP
      if (result.fp) {
        todayCounts.fp = Math.max(
          0,
          (todayCounts.fp || 0) - 1
        );
      }

      if (result.mp) {
        todayCounts.mp = Math.max(
          0,
          (todayCounts.mp || 0) - 1
        );
      }

      updateStatCounts();
      updateChart();
      updateTotalCalls();
      renderDailyPerformance();

      showToast('Last input removed', 'success');
    },

    err => {
      // Undo failed, so restore the category count
      todayCounts[category] =
        (todayCounts[category] || 0) + 1;

      // Restore checkbox state
      if (fpCheckbox) {
        fpCheckbox.checked = wasFpChecked;
      }

      if (mpCheckbox) {
        mpCheckbox.checked = wasMpChecked;
      }

      updateStatCounts();
      updateChart();
      updateTotalCalls();
      renderDailyPerformance();

      console.error('Undo failed:', err);
      showToast(err.message || 'Undo failed', 'error');
    }
  );
}

async function onStatClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;

  const key = btn.dataset.key;
  const delta = btn.dataset.action === 'inc' ? 1 : -1;

  if (delta === -1) {
    if (key === 'ql') {
      await undoLastQL();
    } else {
      await undoLastStat(key);
    }

    return;
  }

  await recordStat(key, 1);
}

/* ════════════════════════════════════════════════════════════════════
   RECORD STAT
   ════════════════════════════════════════════════════════════════════ */
async function recordStat(category, delta) {
  if (!currentUser) { showToast('Not logged in', 'error'); return; }

  // 1. Optimistic local update
  todayCounts[category] = Math.max(0, (todayCounts[category] || 0) + delta);

  const card = document.querySelector(`.stat-card[data-key="${category}"]`);
  const cat  = CATEGORIES.find(c => c.key === category);

  let fpDelta = 0, mpDelta = 0;
  let qlNote  = '';

  if (category === 'ql') {
    fpDelta = delta;
    mpDelta = delta;
    if (delta === 1 && card) {
      const ta = card.querySelector('.ql-comment-input');
      if (ta) { qlNote = ta.value.trim(); }
    }
  } else if (cat && cat.quality && card) {
    const fp = card.querySelector('.quality-fp');
    const mp = card.querySelector('.quality-mp');

    if (fp && fp.checked) fpDelta = delta;
    if (mp && mp.checked) mpDelta = delta;
  }

  if (fpDelta) todayCounts.fp = Math.max(0, (todayCounts.fp || 0) + fpDelta);
  if (mpDelta) todayCounts.mp = Math.max(0, (todayCounts.mp || 0) + mpDelta);

  // Optimistically add the note to local state
  let optimisticLeadNum = null;
  if (category === 'ql' && delta === 1) {
    const today = todayISO();
    if (!qlNotesByDate[today]) qlNotesByDate[today] = [];
    optimisticLeadNum = qlNotesByDate[today].length + 1;
    qlNotesByDate[today].push({ leadNumber: optimisticLeadNum, note: qlNote });
    renderQLNotesToday();
  }

  updateStatCounts();
  updateChart();
  updateTotalCalls();
  renderDailyPerformance();

  // 2. Build payload (note: field renamed ql_note in v2)
  const payload = {
    action:    'stat',
    date:      todayISO(),
    username:  currentUser,
    category:  category,
    delta:     delta,
    fp:        fpDelta !== 0,
    mp:        mpDelta !== 0,
    ql_note:   qlNote   // v2 field name
  };
      
  // 3. Save
  queueSave(payload,
  result => {
    showToast('Saved ✓', 'success');

    // Clear the QL note after a successful save
    if (category === 'ql' && delta === 1 && card) {
      const ta = card.querySelector('.ql-comment-input');
      if (ta) ta.value = '';
    }

    // Uncheck Full Pitch and Money Part after a successful input
    if (cat && cat.quality && delta === 1 && card) {
      const fp = card.querySelector('.quality-fp');
      const mp = card.querySelector('.quality-mp');

      if (fp) fp.checked = false;
      if (mp) mp.checked = false;
    }
  },
    err => {
      todayCounts[category] = Math.max(0, (todayCounts[category] || 0) - delta);
      if (fpDelta) todayCounts.fp = Math.max(0, (todayCounts.fp || 0) - fpDelta);
      if (mpDelta) todayCounts.mp = Math.max(0, (todayCounts.mp || 0) - mpDelta);

      if (category === 'ql' && delta === 1 && optimisticLeadNum !== null) {
        const today = todayISO();
        if (qlNotesByDate[today]) {
          qlNotesByDate[today] = qlNotesByDate[today].filter(n => n.leadNumber !== optimisticLeadNum);
        }
        renderQLNotesToday();
      }

      updateStatCounts();
      updateChart();
      updateTotalCalls();
      renderDailyPerformance();
      showToast('Save failed — check connection', 'error');
    }
  );
  }

async function fetchMonthlyData() {
  if (!selectedMonth || !currentUser) return false;
  showChartState('loading');

  try {
    const json = await new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error.message || error)))
        .serverMonthlyData(selectedMonth, currentUser);
    });
    if (json.error) throw new Error(json.error);
    const days = json.days || [];
    const qlNotes = json.ql_notes || [];
    monthlyData = normalizeMonthlyData(days);

    // Build qlNotesByDate lookup
    qlNotesByDate = {};
    qlNotes.forEach(n => {
      const d = n.date;
      if (!qlNotesByDate[d]) qlNotesByDate[d] = [];
      qlNotesByDate[d].push({ leadNumber: n.leadNumber, note: n.note });
    });
    // Sort each day's notes by lead number
    Object.keys(qlNotesByDate).forEach(d => {
      qlNotesByDate[d].sort((a, b) => a.leadNumber - b.leadNumber);
    });

    // Ensure today's row exists
    const todayStr = todayISO();
    let todayIdx   = monthlyData.findIndex(d => d.date === todayStr);
    if (todayIdx === -1) {
      const emptyRow = { date: todayStr, fp: 0, mp: 0 };
      CATEGORIES.forEach(c => { emptyRow[c.key] = 0; });
      monthlyData.push(emptyRow);
      monthlyData = normalizeMonthlyData(monthlyData);
      todayIdx    = monthlyData.findIndex(d => d.date === todayStr);
    }
    selectedDayIndex = todayIdx;

    // Sync today's counts from sheet
    // Input always previews today, even while Overview displays a past month.
    let todayRow = monthlyData.find(d => d.date === todayStr);
    if (selectedMonth !== todayStr.slice(0, 7)) {
      const todaySnapshot = await new Promise((resolve, reject) => google.script.run
        .withSuccessHandler(resolve).withFailureHandler(reject)
        .serverMonthlyData(todayStr.slice(0, 7), currentUser));
      if (todaySnapshot.error) throw new Error(todaySnapshot.error);
      todayRow = (todaySnapshot.days || []).find(day => day.date === todayStr) || {};
      qlNotesByDate[todayStr] = (todaySnapshot.ql_notes || []).filter(note => note.date === todayStr);
    }
    if (todayRow) {
      CATEGORIES.forEach(c => { todayCounts[c.key] = Number(todayRow[c.key]) || 0; });
      todayCounts.fp = Number(todayRow.fp) || 0;
      todayCounts.mp = Number(todayRow.mp) || 0;
    }

    const yesterdayDate = new Date(todayStr + 'T12:00:00');
    yesterdayDate.setDate(yesterdayDate.getDate() - 1);
    const yesterday = yesterdayDate.getFullYear() + '-' + String(yesterdayDate.getMonth()+1).padStart(2,'0') + '-' + String(yesterdayDate.getDate()).padStart(2,'0');
    const previousData = yesterday.slice(0,7) === selectedMonth ? {days:monthlyData} : await new Promise((resolve,reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).serverMonthlyData(yesterday.slice(0,7),currentUser));
    if (previousData.error) throw new Error(previousData.error);
    const previousRow = (previousData.days || []).find(day => day.date === yesterday) || {};
    inputYesterdayCalls = CATEGORIES.reduce((sum,c) => sum + (Number(previousRow[c.key]) || 0),0);
    updateStatCounts();
    updateTotalCalls();
    renderChart(monthlyData);
    renderDailyPerformance();
    renderQLNotesToday();
    return true;

  } catch (err) {
    showChartState('empty');
    showToast('Failed to load data — check your Supabase setup.', 'error');
    return false;
  }
}

/* ── Normalise (sort + deduplicate) ─────────────────────────────── */
function normalizeMonthlyData(data) {
  return data.slice()
    .sort((a, b) => a.date.localeCompare(b.date))
    .reduce((acc, cur) => {
      if (acc.length && acc[acc.length - 1].date === cur.date) {
        acc[acc.length - 1] = cur;
      } else {
        acc.push(cur);
      }
      return acc;
    }, []);
}

/* ── Optimistic chart update ─────────────────────────────────────── */
function updateChart() {
  const today = todayISO();
  monthlyData = normalizeMonthlyData(monthlyData);
  let row = monthlyData.find(r => r.date === today);
  if (!row) {
    row = { date: today, fp: 0, mp: 0 };
    CATEGORIES.forEach(c => { row[c.key] = 0; });
    monthlyData.push(row);
  }
  row.fp = todayCounts.fp || 0;
  row.mp = todayCounts.mp || 0;
  CATEGORIES.forEach(c => { row[c.key] = todayCounts[c.key] || 0; });
  monthlyData      = normalizeMonthlyData(monthlyData);
  selectedDayIndex = monthlyData.findIndex(d => d.date === today);
  if (selectedDayIndex === -1) selectedDayIndex = monthlyData.length - 1;
  renderChart(monthlyData);
}

// Monthly legend behavior: select one series instead of merely toggling it.
// Clicking the already-isolated series restores the full chart.
function isolateMonthlyDataset(event, legendItem, legend) {
  const chart = legend.chart;
  const selectedIndex = legendItem.datasetIndex;
  const visibleIndexes = chart.data.datasets
    .map((dataset, index) => chart.isDatasetVisible(index) ? index : -1)
    .filter(index => index !== -1);
  const restoreAll = visibleIndexes.length === 1 &&
    visibleIndexes[0] === selectedIndex;

  chart.data.datasets.forEach((dataset, index) => {
    chart.setDatasetVisibility(index, restoreAll || index === selectedIndex);
  });
  chart.update();
}

  });
  document.getElementById('input-performance-date').textContent = todayISO();
  document.getElementById('input-today-calls').textContent = CATEGORIES.reduce((sum,c) => sum + (Number(todayCounts[c.key]) || 0),0);
  document.getElementById('input-yesterday-calls').textContent = inputYesterdayCalls;
  CATEGORIES.forEach(c => {
    const el = document.querySelector(`[data-count="${c.key}"]`);
    if (el) el.textContent = todayCounts[c.key] || 0;
  });
}

function updateTotalCalls() {
  const today = todayISO();
  const norm  = normalizeMonthlyData(monthlyData);
  let todayTotal = 0, yesterdayTotal = 0, weekTotal = 0, monthTotal = 0, weekQL = 0, monthQL = 0;

  const tDate = new Date(...today.split('-').map((v, i) => i === 1 ? Number(v) - 1 : Number(v)));
  tDate.setHours(12);

  norm.forEach(day => {
    const p    = day.date.split('-').map(Number);
    const rDate = new Date(p[0], p[1]-1, p[2], 12);
    const total = CATEGORIES.reduce((s, c) => s + (Number(day[c.key]) || 0), 0);
    const diff  = (tDate - rDate) / 86400000;
    if (diff === 0)          todayTotal     = total;
    if (diff === 1)          yesterdayTotal = total;
    if (diff >= 0 && diff < 7) { weekTotal += total;  weekQL  += Number(day.ql) || 0; }
    monthTotal += total;
    monthQL    += Number(day.ql) || 0;
  });

  if (todayTotal === 0)
    todayTotal = CATEGORIES.reduce((s, c) => s + (todayCounts[c.key] || 0), 0);

  document.getElementById('total-calls').textContent     = todayTotal;
  document.getElementById('yesterday-calls').textContent = yesterdayTotal;
  document.getElementById('week-calls').textContent      = weekTotal;
  document.getElementById('month-calls').textContent     = monthTotal;
  document.getElementById('week-ql').textContent         = weekQL;
  document.getElementById('month-ql').textContent        = monthQL;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function calendarDays(month, data) {
  if (!/^\d{4}-\d{2}$/.test(month)) return [];
  const [year, number] = month.split('-').map(Number);
  const length = new Date(year, number, 0).getDate();
  return Array.from({length}, (_, i) => {
    const date = month + '-' + String(i + 1).padStart(2, '0');
    const row = data.find(day => day.date === date);
    return {date, day: i + 1, count: Number(row && row.ql) || 0, recorded: !!row};
  });
}

function stopChat() {
  chatActive = false;
  chatVersion++;
  clearInterval(chatTimer);
  chatTimer = null;
}
function startChat() {
  chatActive = true;
  refreshChat();
  chatTimer = setInterval(() => {
    if (!document.hidden) refreshChat();
  }, 10000);
}
function switchChat(peer) {
  chatPeer = peer;
  chatVersion++;
  chatMessages = [];
  chatHasMore = false;
  document.getElementById('chat-text').value = '';
  document.getElementById('chat-title').textContent = peer ? 'Private: ' + formatUsername(peer) : 'Everyone';
  document.querySelector('.chat-compose-label').textContent = peer ? 'Message ' + formatUsername(peer) + ' privately' : 'Message everyone';
  document.getElementById('chat-peer').value = peer;
  renderChatMessages();
  refreshChat();
}
function renderChatMessages() {
  const list = document.getElementById('chat-messages');
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 100;
  const now = Date.now();
  chatMessages = chatMessages.filter(message => message.expiresAt > now);
  const markup = chatMessages.length ? chatMessages.map(message => {
    const own = message.sender === currentUser.toLowerCase().trim();
    return `<article class="chat-message ${own ? 'chat-own' : ''}">
      <div class="chat-message-header"><strong>${escapeHtml(formatUsername(message.sender))}</strong>
      <time datetime="${new Date(message.createdAt).toISOString()}" title="Expires ${escapeHtml(new Date(message.expiresAt).toLocaleString())}">${escapeHtml(new Date(message.createdAt).toLocaleString())}</time></div>
      <p>${escapeHtml(message.text)}</p><div class="chat-message-actions">${own
        ? `<button type="button" data-chat-recall="${escapeHtml(message.id)}">Recall</button>`
        : `<button type="button" data-chat-private="${escapeHtml(message.sender)}">Message privately</button>`}</div></article>`;
  }).join('') : '<p class="chat-empty">No messages yet. Start the conversation.</p>';
  if (list.innerHTML !== markup) { list.innerHTML = markup; if (nearBottom) list.scrollTop = list.scrollHeight; }
  document.getElementById('chat-older').hidden = !chatHasMore;
}
async function refreshChat(older = false) {
  if (!chatActive || !currentUser || chatLoadingVersion === chatVersion) return;
  if (!chatToken) {
    document.getElementById('chat-status').textContent = 'Sign out and sign in again to enable chat.';
    return;
  }
  const version = chatVersion;
  chatLoadingVersion = version;
  renderChatMessages();
  try {
    const result = await postToScript({action:'chatList', token:chatToken, peer:chatPeer,
      before:older && chatMessages.length ? chatMessages[0].id : '',
      start:!older && chatMessages.length > 100 ? chatMessages[0].id : ''});
    if (version !== chatVersion || !chatActive) return;
    if (older) {
      const known = new Set(chatMessages.map(message => message.id));
      chatMessages = [...result.messages.filter(message => !known.has(message.id)), ...chatMessages];
    } else {
      // A refresh replaces the visible window so recalled messages disappear too.
      chatMessages = result.messages;
    }
    chatHasMore = result.hasMore;
    markChatRead(result.messages);
    refreshUnreadChat();
    renderChatMessages();
    const select = document.getElementById('chat-peer');
    select.innerHTML = '<option value="">Choose a user</option>' + result.users.map(user =>
      `<option value="${escapeHtml(user)}">${escapeHtml(formatUsername(user))}</option>`).join('');
    select.value = chatPeer;
    document.getElementById('chat-partners').innerHTML = result.partners.map(user =>
      `<button type="button" class="chat-room-button" data-chat-private="${escapeHtml(user)}">${escapeHtml(formatUsername(user))}</button>`).join('');
    document.getElementById('chat-status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (error) {
    if (version !== chatVersion) return;
    document.getElementById('chat-status').textContent = error.message || 'Connection failed. Retrying...';
    if (String(error.message).includes('CHAT_AUTH')) { clearInterval(chatTimer); chatToken = ''; }
  } finally { if (chatLoadingVersion === version) chatLoadingVersion = -1; }
}

document.getElementById('chat-card').addEventListener('click', async event => {
  const privateButton = event.target.closest('[data-chat-private]');
  if (privateButton) { switchChat(privateButton.dataset.chatPrivate); return; }
  const recall = event.target.closest('[data-chat-recall]');
  if (!recall || !confirm('Recall this message for everyone in this conversation?')) return;
  recall.disabled = true;
  const version = chatVersion;
  try {
    await postToScript({action:'chatRecall', token:chatToken, id:recall.dataset.chatRecall});
    if (version === chatVersion) {
      chatMessages = chatMessages.filter(message => message.id !== recall.dataset.chatRecall);
      renderChatMessages();
    }
  } catch (error) { showToast(error.message || 'Could not recall message', 'error'); }
  finally { recall.disabled = false; }
});
document.getElementById('chat-form').addEventListener('submit', async event => {
  event.preventDefault();
  const textField = document.getElementById('chat-text');
  const text = textField.value.trim();
  const button = document.getElementById('chat-send');
  if (!text || button.disabled) return;
  const version = chatVersion;
  const requestId = crypto.randomUUID();
  button.disabled = true;
  try {
    await postToScript({action:'chatSend', token:chatToken, peer:chatPeer, text, requestId});
    if (version === chatVersion) {
      if (textField.value.trim() === text) textField.value = '';
      document.getElementById('chat-status').textContent = 'Message sent';
      // Invalidate an older poll before asking for the newly saved message.
      chatVersion++;
      await refreshChat();
    }
  } catch (error) { showToast(error.message || 'Message could not be sent. Your draft is kept.', 'error'); }
  finally { button.disabled = false; }
});

document.querySelectorAll('[data-password]').forEach(button => button.addEventListener('click', () => {
  const input = document.getElementById(button.dataset.password);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.textContent = show ? 'Hide password' : 'Show password';
  button.setAttribute('aria-pressed', String(show));
}));
function chatReadIds() {
  try { return JSON.parse(localStorage.getItem('tq_chat_read:' + currentUser.toLowerCase().trim()) || '[]'); } catch { return []; }
}
function markChatRead(messages) {
  if (document.hidden || !chatActive) return;
  const ids = [...new Set([...chatReadIds(), ...messages.map(message => message.id)])].slice(-10000);
  try { localStorage.setItem('tq_chat_read:' + currentUser.toLowerCase().trim(), JSON.stringify(ids)); } catch {}
}
async function refreshUnreadChat() {
  if (!currentUser || !chatToken || unreadBusy) return;
  const user = currentUser, token = chatToken;
  unreadBusy = true;
  try {
    const result = await postToScript({action:'chatUnread',token});
    if (currentUser !== user || chatToken !== token) return;
    const read = new Set(chatReadIds());
    const count = result.messages.filter(message => !read.has(message.id)).length;
    const badge = document.getElementById('chat-unread');
    badge.textContent = String(count);
    badge.hidden = count === 0;
    badge.setAttribute('aria-label', count + ' unread messages');
  } catch {} finally { unreadBusy = false; }
}

</script>
