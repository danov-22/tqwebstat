<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timezones - TQ Web Stat</title><meta name="description" content="Build your world clock with country flags and live times grouped by timezone."><link rel="icon" href="../tq-favicon.svg"><link rel="stylesheet" href="../portal.css"><link rel="stylesheet" href="../timezone.css"><style>
header{gap:20px}.timezone-main{padding-top:52px;max-width:1240px}.timezone-intro{margin-bottom:40px}.timezone-intro h1{font:900 clamp(30px,4vw,48px)/1 system-ui,sans-serif;letter-spacing:-.06em;margin:12px 0 20px}.timezone-intro p{color:var(--muted);max-width:620px;line-height:1.7}.timezone-toplinks{display:flex;gap:18px;align-items:center}.timezone-toplinks a{color:var(--text);text-decoration:none;font-size:14px}.tz-workspace{background:var(--surface);padding:28px;border:1px solid var(--line);border-radius:18px}@media(max-width:560px){header{padding:16px;height:auto;flex-wrap:wrap}.timezone-main{padding:32px 16px}.tz-workspace{padding:18px}.timezone-toplinks{flex-wrap:wrap;gap:12px}}
</style></head><body><header><a class="brand" href="../"><img class="site-logo" src="../tq-favicon.png" width="36" height="36" alt="TQ"><b>Web Stat</b></a><nav class="timezone-toplinks" aria-label="Main navigation"><a href="../demo/">Demo</a><a href="../app/">Work</a><a href="./" aria-current="page">Timezones</a><button class="theme-toggle" id="timezone-theme" type="button">Light mode</button></nav></header><main class="timezone-main"><div class="timezone-intro"><p>TIME ON THE OTHER SIDE OF THE WORLD</p><h1>TIMEZONE</h1><p>From the first call to the last conversation. Keep the countries you work with together, grouped by their local time.</p></div><section id="public-timezones" aria-label="World clocks"></section></main><footer><span>TQ Web Stat</span><a href="../" style="color:inherit">Back to landing page</a></footer><script src="../timezone.js"></script><script>
const themeButton=document.getElementById('timezone-theme');
function theme(value){document.documentElement.dataset.theme=value;themeButton.textContent=value==='light'?'Dark mode':'Light mode';themeButton.setAttribute('aria-pressed',String(value==='light'));}
let saved='dark';try{saved=localStorage.getItem('tq_portal_theme')||saved;}catch{}theme(saved);
themeButton.onclick=()=>{const value=document.documentElement.dataset.theme==='light'?'dark':'light';theme(value);try{localStorage.setItem('tq_portal_theme',value);}catch{}};
TQTimezones.mount(document.getElementById('public-timezones'));
</script></body></html>
