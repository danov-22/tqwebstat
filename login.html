<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TQ Web Statistics — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-icon">TQ</div>
        <h1 class="login-title">TQ Web Statistics</h1>
        <p class="login-subtitle">Sign in to access your dashboard</p>
      </div>

      <!-- Error message (hidden by default) -->
      <div class="login-error" id="login-error" style="display:none;"></div>

      <form class="login-form" id="login-form" autocomplete="on">

        <div class="login-field">
          <label class="field-label" for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="text-input"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>

        <div class="login-field">
          <label class="field-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="text-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary login-btn" id="login-btn">
          Sign In
        </button>

      </form>

      <p class="login-footer">
        Contact your admin to get access.
      </p>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    //
    // IMPORTANT: Paste your Apps Script Web App URL below.
    // Get it from: Extensions → Apps Script → Deploy → Manage Deployments
    //
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzO01wWjuYCgiPtdCaO74c7tiyufH7pJAVcorRGaYwOvnP6LrvhFX21Zc30xHnyWg5S/exec';

    // How long the login session lasts (in milliseconds).
    // Default: 8 hours. Change to 24 * 60 * 60 * 1000 for 24 hours, etc.
    var SESSION_DURATION_MS = 8 * 60 * 60 * 1000;

    // ── Already logged in? Go straight to the app ─────────────────────────────
    (function checkExistingSession() {
      var token   = localStorage.getItem('tq_token');
      var expiry  = Number(localStorage.getItem('tq_token_expiry') || 0);
      if (token && Date.now() < expiry) {
        window.location.href = 'index.html';
      }
    })();

    // ── DOM refs ──────────────────────────────────────────────────────────────
    var form      = document.getElementById('login-form');
    var errorBox  = document.getElementById('login-error');
    var loginBtn  = document.getElementById('login-btn');
    var toast     = document.getElementById('toast');

    // ── Form submit ───────────────────────────────────────────────────────────
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter your username and password.');
        return;
      }

      // Check if the Script URL is configured
      if (!SCRIPT_URL) {
        // Let users configure the URL right here if missing
        var url = prompt(
          'Enter your Google Apps Script Web App URL:\n' +
          '(You can find it in Extensions → Apps Script → Deploy)'
        );
        if (!url || !url.trim()) {
          showError('No Apps Script URL configured. Please add it.');
          return;
        }
        SCRIPT_URL = url.trim();
        localStorage.setItem('tq_script_url', SCRIPT_URL);
      }

      setLoading(true);

      try {
        var res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action:   'login',
            username: username,
            password: password
          })
        });

        var data = await res.json();

        if (data.success) {
          // Save session
          localStorage.setItem('tq_token',        data.token);
          localStorage.setItem('tq_token_expiry', String(Date.now() + SESSION_DURATION_MS));
          localStorage.setItem('tq_user_name',    data.name || username);

          showToast('Welcome back, ' + (data.name || username) + '!', 'success');

          // Redirect after a short pause so the toast is visible
          setTimeout(function () {
            window.location.href = 'index.html';
          }, 600);

        } else {
          showError(data.error || 'Incorrect username or password.');
          setLoading(false);
        }

      } catch (err) {
        showError(
          'Could not reach the server. Check your internet connection or Script URL.'
        );
        setLoading(false);
      }
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setLoading(on) {
      loginBtn.disabled   = on;
      loginBtn.textContent = on ? 'Signing in…' : 'Sign In';
    }

    function showError(msg) {
      errorBox.textContent    = msg;
      errorBox.style.display  = 'block';
    }

    function clearError() {
      errorBox.style.display = 'none';
      errorBox.textContent   = '';
    }

    var toastTimer = null;
    function showToast(message, type) {
      toast.textContent = message;
      toast.className   = 'toast toast-' + type + ' show';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>

</body>
</html>
