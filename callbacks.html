<style>
.cb-form { display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:18px 0; }
.cb-form label { display:flex;flex-direction:column;gap:6px; }

.cb-float[hidden] { display:none; }
.cb-handle { display:block;width:100%;padding:12px;text-align:left;cursor:grab;touch-action:none;background:transparent;color:inherit;border:0;border-bottom:1px solid var(--border,#2a2d3a);font:inherit;font-weight:bold; }
.cb-float .cb-item { padding:14px;border:0; }
.cb-due { color:var(--accent,#60a5fa);font-weight:bold; }
.cb-picker { display:flex;gap:8px;align-items:center; }
.cb-picker input { min-width:0; }
.cb-picker button { flex-shrink:0; }
.cb-weekday { font-size:.85rem;color:var(--muted,#8b94a9); }
.cb-float { resize:both;min-width:min(240px,calc(100vw - 36px));min-height:160px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden; }
.cb-handle { flex-shrink:0; }
.cb-float > div { overflow:auto;flex:1;min-height:0; }
</style>
<script>
(function(global){
'use strict';
function localParts(date,zone){return Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(p=>[p.type,p.value]));}
function instant(day,time,zone){

  const offsets=new Set([-86400000,0,86400000].map(delta=>TQTimezones.utcMinutes(zone,new Date(wanted+delta))));

    const p=localParts(new Date(value),zone);return p.year+'-'+p.month+'-'+p.day===day && p.hour+':'+p.minute===time;

}

function validSaved(item){
  if(!item || typeof item.id!=='string' || typeof item.name!=='string' || !Number.isInteger(item.country) || !TQTimezones.countries[item.country] || !Number.isFinite(item.at) || !/^\d{4}-\d{2}-\d{2}$/.test(item.day) || !/^\d{2}:\d{2}$/.test(item.time) || (item.note!==undefined && typeof item.note!=='string'))return false;

}

  const name=field('Person / company','text');name.required=true;name.maxLength=150;

  const dateLabel=day.parentElement,datePicker=el('div',undefined,'cb-picker'),calendar=el('button','Calendar','sync-btn');calendar.type='button';datePicker.append(day,calendar);dateLabel.append(datePicker);
  const weekday=el('span','Choose a date', 'cb-weekday');dateLabel.append(weekday);
  function updateWeekday(){weekday.textContent=day.value?new Intl.DateTimeFormat(undefined,{weekday:'long',timeZone:'UTC'}).format(new Date(day.value+'T12:00:00Z')):'Choose a date';}
  day.addEventListener('change',updateWeekday);
  calendar.onclick=()=>{try{day.showPicker();}catch{day.focus();day.click();}};
  const timeLabel=el('label','Local time (24-hour)'),timePicker=el('div',undefined,'cb-picker'),hour=el('select'),minute=el('select');
  hour.setAttribute('aria-label','Hour');minute.setAttribute('aria-label','Minute');
  for(let i=0;i<24;i++){const value=String(i).padStart(2,'0'),option=el('option',value);option.value=value;hour.append(option);}
  for(let i=0;i<60;i++){const value=String(i).padStart(2,'0'),option=el('option',value);option.value=value;minute.append(option);}
  hour.value='09';hour.querySelector('[value="09"]').defaultSelected=true;
  timePicker.append(hour,el('span',':'),minute);timeLabel.append(timePicker);form.append(timeLabel);
  const time={get value(){return hour.value+':'+minute.value;},set value(value){const parts=value.split(':');hour.value=parts[0];minute.value=parts[1];}};
  const note=field('Notes (optional)','textarea');note.maxLength=4000;
  const submit=el('button','Add callback','sync-btn');submit.type='submit';form.append(submit);
  const cancel=el('button','Cancel edit','sync-btn');cancel.type='button';cancel.hidden=true;form.append(cancel);
  const status=el('p');status.setAttribute('role','status');
  const toggleLabel=el('label'),toggle=el('input');toggle.type='checkbox';toggle.checked=true;toggleLabel.append(toggle,document.createTextNode(' Show floating callback reminder'));
  const list=el('div');root.append(form,status,toggleLabel,list);
  const floating=el('aside',undefined,'cb-float'),handle=el('button','Upcoming callback · drag to move','cb-handle'),body=el('div');handle.type='button';handle.title='Drag to move, or use arrow keys.';floating.setAttribute('aria-label','Callback reminder');floating.append(handle,body);document.body.append(floating);
  try{const saved=JSON.parse(localStorage.getItem(key)||'{}')||{};items=(Array.isArray(saved.items)?saved.items:[]).filter(validSaved);toggle.checked=saved.show!==false;position=saved.position||null;size=saved.size||null;}catch{status.textContent='Could not read saved callbacks.';}
  if(!position || !Number.isFinite(position.x) || !Number.isFinite(position.y))position=null;
  function save(next=items){try{localStorage.setItem(key,JSON.stringify({items:next,show:toggle.checked,position,size}));items=next;status.textContent='Saved on this browser.';return true;}catch{status.textContent='Could not save callbacks. Browser storage may be full or unavailable.';return false;}}
  function place(x,y){const r=floating.getBoundingClientRect();position={x:Math.max(8,Math.min(x,innerWidth-r.width-8)),y:Math.max(8,Math.min(y,innerHeight-r.height-8))};floating.style.left=position.x+'px';floating.style.top=position.y+'px';}
  function reset(){form.reset();updateWeekday();editing=null;submit.textContent='Add callback';cancel.hidden=true;}
  function action(parent,title,fn){const b=el('button',title,'sync-btn');b.type='button';b.onclick=fn;parent.append(b);}
  function card(item){
    const c=TQTimezones.countries[item.country],row=el('article',undefined,'cb-item');row.dataset.id=item.id;row.append(el('strong',item.name+' · '+c[0]));
    const due=item.at<=Date.now();row.append(el('p',due?'Due — call now':'Upcoming', 'cb-due'));
    const format=zone=>new Intl.DateTimeFormat(undefined,{...(zone?{timeZone:zone}:{}),dateStyle:'medium',timeStyle:'short'}).format(new Date(item.at));
    row.append(el('p',format(c[1])+' · '+c[1]),el('p','Your time: '+format()));if(item.note)row.append(el('p',item.note));
    const actions=el('div',undefined,'cb-actions');
    action(actions,'Called',()=>{if(save(items.filter(i=>i.id!==item.id))){if(editing===item.id)reset();render();}});
    action(actions,'Remove',()=>{if(save(items.filter(i=>i.id!==item.id))){if(editing===item.id)reset();render();status.textContent='Callback removed.';}});
    for(const days of [1,7])action(actions,'Skip '+(days===1?'1 day':'1 week'),()=>{
      try{let nextDay=shiftDay(item.day,days),at=instant(nextDay,item.time,c[1]);while(at<=Date.now()){nextDay=shiftDay(nextDay,days);at=instant(nextDay,item.time,c[1]);}if(save(items.map(i=>i.id===item.id?{...i,day:nextDay,at}:i))){if(editing===item.id){day.value=nextDay;updateWeekday();}render();}}catch(e){status.textContent=e.message;}
    });
    action(actions,'Reschedule / edit',()=>{editing=item.id;name.value=item.name;country.value=item.country;day.value=item.day;updateWeekday();time.value=item.time;note.value=item.note||'';submit.textContent='Save callback';cancel.hidden=false;document.querySelector('[data-app-page="input"]').click();form.scrollIntoView({behavior:'smooth',block:'center'});name.focus({preventScroll:true});});
    row.append(actions);return row;
  }
  function render(){
    const sorted=items.slice().sort((a,b)=>a.at-b.at),next=JSON.stringify(sorted.map(i=>[i,i.at<=Date.now()]));
    if(signature!==next){
      signature=next;
      const focused=document.activeElement,row=focused&&focused.closest('.cb-item'),buttons=row&&Array.from(row.querySelectorAll('button')),focusIndex=buttons?buttons.indexOf(focused):-1,focusId=row&&row.dataset.id,inFloat=floating.contains(focused);
      list.replaceChildren();body.replaceChildren();
      if(!sorted.length)list.append(el('p','No callbacks scheduled.'));
      sorted.forEach(i=>list.append(card(i)));if(sorted.length)body.append(card(sorted[0]));
      if(focusIndex>=0){const target=Array.from((inFloat?body:list).querySelectorAll('.cb-item')).find(r=>r.dataset.id===focusId);if(target)target.querySelectorAll('button')[focusIndex]?.focus({preventScroll:true});}
    }
    floating.hidden=!toggle.checked||!sorted.length;if(position&&!floating.hidden)place(position.x,position.y);
  }
  form.onsubmit=e=>{e.preventDefault();try{const countryId=Number(country.value),at=instant(day.value,time.value,TQTimezones.countries[countryId][1]);if(at<=Date.now())throw Error('Choose an upcoming date and time.');if(!name.value.trim())throw Error('Enter a person or company.');const item={id:editing||crypto.randomUUID(),name:name.value.trim(),country:countryId,day:day.value,time:time.value,note:note.value.trim(),at};const next=editing?items.map(i=>i.id===editing?item:i):[...items,item];if(save(next)){reset();render();}}catch(e){status.textContent=e.message;}};
  cancel.onclick=reset;toggle.onchange=()=>{save();render();};
  handle.onpointerdown=e=>{if(e.button!==0)return;const r=floating.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top};handle.setPointerCapture(e.pointerId);e.preventDefault();};
  handle.onpointermove=e=>{if(drag&&drag.id===e.pointerId)place(drag.left+e.clientX-drag.x,drag.top+e.clientY-drag.y);};
  const end=()=>{if(drag){drag=null;save();}};handle.onpointerup=end;handle.onpointercancel=end;handle.onlostpointercapture=end;
  handle.onkeydown=e=>{const moves={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]},m=moves[e.key];if(m){e.preventDefault();const r=floating.getBoundingClientRect();place(r.left+m[0],r.top+m[1]);save();}};
  function resize(){if(position&&!floating.hidden)place(position.x,position.y);}global.addEventListener('resize',resize);
  floating.title='Drag the header to move; drag the bottom-right corner to resize.';
  if(size && Number.isFinite(size.width) && Number.isFinite(size.height)){
    floating.style.width=Math.max(240,size.width)+'px';floating.style.height=Math.max(160,size.height)+'px';
  }
  const sizeObserver=new ResizeObserver(()=>{
    if(floating.hidden)return;
    const rect=floating.getBoundingClientRect();
    if(!size || Math.abs(size.width-rect.width)>1 || Math.abs(size.height-rect.height)>1){size={width:rect.width,height:rect.height};if(position)place(position.x,position.y);save();}
  });

  const timer=setInterval(render,30000);render();return {destroy(){clearInterval(timer);sizeObserver.disconnect();global.removeEventListener('resize',resize);floating.remove();root.replaceChildren();}};
}
global.TQCallbacks={mount,instant,shiftDay,validSaved};
})(window);
</script>
